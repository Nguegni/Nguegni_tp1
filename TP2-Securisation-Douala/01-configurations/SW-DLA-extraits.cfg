! TRANSCRIPTION PARTIELLE — ne pas appliquer comme configuration complète.
! Règles exactes M1 : support non fourni, références à compléter.
! Thème M1 : cloisonnement / maîtrise des trunks.
! Source : preuves/04-config-trunk.png, avant les tests 3 et 4.
interface GigabitEthernet0/0
 description TRUNK-VERS-R-DLA
 switchport trunk allowed vlan 10,20,30,40,50,99
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 998
 switchport mode trunk
 switchport nonegotiate
 ip arp inspection trust
 negotiation auto
 ip dhcp snooping trust
!
! Thème M1 : limitation des équipements sur les accès / DHCP.
! Source : preuves/05-config-guichet.png, avant activation temporaire IPSG.
interface GigabitEthernet0/1
 description POSTE-GUICHET
 switchport access vlan 10
 switchport mode access
 switchport nonegotiate
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 switchport port-security mac-address sticky 0050.7966.6803
 switchport port-security
 negotiation auto
 ip dhcp snooping limit rate 15
!
! Thème M1 : filtrage IP sur les accès.
! IPSG a été activé sur Gi0/1 et Gi0/2 puis retiré sur les deux ports.
! La capture 12 montre une table show ip verify source vide.
! L'activation n'est donc PAS présentée comme état final fonctionnel.
!
! Thème M1 : prévention d'un équipement non autorisé / test 3.
! Commandes saisies et état confirmé par preuves/13 et 14.
interface GigabitEthernet1/3
 switchport port-security
 switchport port-security maximum 2
 switchport port-security violation restrict
 no shutdown
!
! Thème M1 : protection Spanning Tree / préparation du test 4.
! Source : preuves/16-bpduguard-configuration-racine-avant.png.
spanning-tree mode rapid-pvst
interface GigabitEthernet1/3
 spanning-tree portfast
 spanning-tree bpduguard enable
exit
errdisable recovery cause bpduguard
errdisable recovery interval 300
!
! Pour isoler BPDU Guard, Port Security a été retiré temporairement
! de Gi1/3. Gi1/3 est ensuite observé err-disabled (preuve 18).
! La remise finale en shutdown et la réactivation de Port Security
! ont été demandées, mais leur exécution n'est pas prouvée.
