version 15.6
service timestamps debug datetime msec
service timestamps log datetime msec
no service password-encryption
!
hostname R-SIEGE
!
boot-start-marker
boot-end-marker
!
!
!
no aaa new-model
ethernet lmi ce
!
!
!
mmi polling-interval 60
no mmi auto-configure
no mmi pvc
mmi snmp-timeout 180
!
!
!
!
!
!
!
!
ip dhcp excluded-address 10.10.10.1 10.10.10.99
!
ip dhcp pool LAN-SIEGE
 network 10.10.10.0 255.255.255.0
 default-router 10.10.10.1 
 dns-server 203.0.113.10 
 domain-name camtrust.lab
!
!
!
ip domain name camtrust.lab
ip cef
no ipv6 cef
!
multilink bundle-name authenticated
!
!
!
!
! Secret utilisateur expurge : definir un nouveau compte admin avant activation VTY.
!
redundancy
!
!
! 
!
!
!
!
!
!
!
!
!
!
!
!
interface GigabitEthernet0/0
 ip address 10.10.10.1 255.255.255.0
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/1
 ip address 198.51.100.2 255.255.255.252
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/2
 ip address 172.16.12.1 255.255.255.252
 duplex auto
 speed auto
 media-type rj45
!
interface GigabitEthernet0/3
 no ip address
 shutdown
 duplex auto
 speed auto
 media-type rj45
!
ip forward-protocol nd
!
!
no ip http server
no ip http secure-server
ip route 0.0.0.0 0.0.0.0 198.51.100.1
ip route 10.20.10.0 255.255.255.0 172.16.12.2
ip ssh version 2
!
!
snmp-server chassis-id 
!
!
control-plane
!
banner exec ^C
